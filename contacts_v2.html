<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FB Contacts">
<title>Ferenc Bodor — Contacts</title>
<style>
  :root {
    --bg: #0d0d0d; --bg2: #141414; --bg3: #1c1c1c; --bg4: #242424;
    --border: #2a2a2a; --text: #f0f0f0; --text2: #888; --text3: #555;
    --red: #e05555; --green: #4caf7d; --yellow: #e0b255;
    --blue: #5588e0; --purple: #9b6fe0; --orange: #e07a35;
    --font: 'Helvetica Neue', Arial, sans-serif; --radius: 6px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; overscroll-behavior: none; }

  .app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 56px 1fr; height: 100vh; overflow: hidden; }
  .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--bg2); border-bottom: 1px solid var(--border); padding-top: var(--safe-top); }
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px 0; }
  .main { overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }

  .logo { font-size: 13px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; white-space: nowrap; }
  .logo span { color: var(--text2); font-weight: 400; }
  .search-wrap { flex: 1; max-width: 400px; position: relative; }
  .search-wrap input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px 7px 30px; color: var(--text); font-size: 13px; outline: none; -webkit-appearance: none; }
  .search-wrap input::placeholder { color: var(--text3); }
  .search-wrap input:focus { border-color: #444; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; pointer-events: none; }
  .topbar-actions { display: flex; align-items: center; gap: 6px; }
  .btn { padding: 7px 14px; border-radius: var(--radius); border: none; cursor: pointer; font-size: 13px; font-family: var(--font); font-weight: 500; transition: opacity 0.15s; touch-action: manipulation; }
  .btn:active { opacity: 0.7; }
  .btn-primary { background: var(--text); color: #000; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .count-badge { background: var(--bg4); color: var(--text2); font-size: 12px; padding: 3px 8px; border-radius: 20px; margin-left: auto; }

  .sidebar-section { padding: 0 12px 16px; }
  .sidebar-label { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); padding: 0 8px 8px; }
  .filter-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: var(--radius); border: none; background: transparent; color: var(--text2); cursor: pointer; font-size: 13px; font-family: var(--font); text-align: left; transition: background 0.1s, color 0.1s; touch-action: manipulation; }
  .filter-btn:hover { background: var(--bg3); color: var(--text); }
  .filter-btn.active { background: var(--bg4); color: var(--text); }
  .filter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .filter-count { margin-left: auto; font-size: 11px; color: var(--text3); }
  .sidebar-divider { height: 1px; background: var(--border); margin: 8px 12px 16px; }

  .followup-alert { background: #1a1200; border: 1px solid #3a2800; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; display: none; }
  .followup-alert.visible { display: block; }
  .followup-alert h4 { font-size: 12px; font-weight: 600; color: var(--yellow); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .followup-names { display: flex; flex-wrap: wrap; gap: 6px; }
  .followup-chip { background: #2a1e00; border: 1px solid #3a2800; border-radius: 20px; padding: 3px 10px; font-size: 12px; color: var(--yellow); cursor: pointer; touch-action: manipulation; }

  .same-company-warning { background: #1a0a00; border: 1px solid #3a1800; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; display: none; font-size: 12px; color: var(--orange); gap: 8px; align-items: flex-start; }
  .same-company-warning.visible { display: flex; }

  .view-toggle { display: flex; gap: 4px; }
  .view-btn { background: transparent; border: 1px solid var(--border); color: var(--text3); border-radius: var(--radius); padding: 5px 10px; cursor: pointer; font-size: 12px; touch-action: manipulation; }
  .view-btn.active { background: var(--bg4); color: var(--text); border-color: #444; }
  .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--text2); letter-spacing: 0.08em; text-transform: uppercase; }

  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .contact-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: border-color 0.15s, background 0.15s; position: relative; touch-action: manipulation; }
  .contact-card:active { background: var(--bg3); border-color: #444; }
  @media (hover: hover) { .contact-card:hover { border-color: #444; background: var(--bg3); } }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .card-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--bg4); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--text2); flex-shrink: 0; }
  .card-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .card-role { font-size: 12px; color: var(--text2); }
  .card-company { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .tag-status { border: 1px solid; }
  .tag-city { background: var(--bg4); color: var(--text3); }
  .card-followup { font-size: 11px; color: var(--yellow); margin-top: 8px; }
  .card-followup.overdue { color: var(--red); }
  .multi-star { position: absolute; top: 12px; right: 12px; font-size: 14px; }

  .contacts-table { width: 100%; border-collapse: collapse; }
  .contacts-table th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .contacts-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  .contacts-table tr:last-child td { border-bottom: none; }
  .contacts-table tr:active td { background: var(--bg3); }
  @media (hover: hover) { .contacts-table tr:hover td { background: var(--bg3); cursor: pointer; } }

  .status-to-contact { color: var(--text3); border-color: var(--text3); }
  .status-contacted { color: var(--blue); border-color: var(--blue); background: rgba(85,136,224,0.08); }
  .status-in-talk { color: var(--yellow); border-color: var(--yellow); background: rgba(224,178,85,0.08); }
  .status-booked { color: var(--green); border-color: var(--green); background: rgba(76,175,125,0.08); }
  .status-cold { color: var(--text3); border-color: var(--border); background: var(--bg4); }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: none; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px 12px 0 0; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: var(--safe-bottom); animation: slideUp 0.22s ease; }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-drag { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 10px auto 0; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 0; margin-bottom: 16px; }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-close { background: transparent; border: none; color: var(--text3); font-size: 22px; cursor: pointer; line-height: 1; padding: 4px 8px; touch-action: manipulation; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 0 20px 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); }
  .form-group input, .form-group select, .form-group textarea { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; color: var(--text); font-size: 16px; font-family: var(--font); outline: none; -webkit-appearance: none; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #555; }
  .form-group textarea { resize: vertical; min-height: 72px; font-size: 14px; }
  .form-group select option { background: var(--bg3); }
  .checkbox-group { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .checkbox-group input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--purple); cursor: pointer; flex-shrink: 0; }
  .checkbox-group label { font-size: 13px; color: var(--text); cursor: pointer; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .modal-footer { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
  .modal-footer .btn-danger { margin-right: auto; }
  .modal-footer .btn:not(.btn-danger) { flex: 1; text-align: center; padding: 11px 14px; }

  .email-link-wrap { position: relative; }
  .email-link-wrap input { padding-right: 38px; }
  .email-mailto { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text3); font-size: 15px; padding: 4px; touch-action: manipulation; }
  .email-mailto:hover { color: var(--blue); }

  .outreach-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
  .outreach-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; }
  .log-entry { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .log-date { font-size: 11px; color: var(--text3); white-space: nowrap; padding-top: 2px; min-width: 68px; }
  .log-text { font-size: 13px; color: var(--text2); flex: 1; line-height: 1.4; }
  .log-add { display: flex; gap: 8px; margin-top: 10px; }
  .log-add input { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; color: var(--text); font-size: 16px; font-family: var(--font); outline: none; -webkit-appearance: none; }
  .log-add input:focus { border-color: #555; }

  .followup-suggest { display: none; background: #0d1a0d; border: 1px solid #1a3a1a; border-radius: var(--radius); padding: 10px 14px; margin-top: 10px; font-size: 12px; color: var(--green); align-items: center; gap: 10px; flex-wrap: wrap; }
  .followup-suggest.visible { display: flex; }
  .followup-suggest .fs-set { background: var(--green); color: #000; border: none; border-radius: 4px; padding: 4px 10px; font-size: 11px; font-weight: 600; cursor: pointer; touch-action: manipulation; }
  .followup-suggest .fs-dismiss { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 12px; touch-action: manipulation; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty h3 { font-size: 16px; color: var(--text2); margin-bottom: 8px; }
  .empty p { font-size: 13px; line-height: 1.6; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

  .toast { position: fixed; bottom: calc(20px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(16px); background: #222; border: 1px solid #444; color: var(--text); padding: 9px 18px; border-radius: 20px; font-size: 13px; z-index: 500; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* DATA MENU */
  #dataMenu { position: absolute; top: 56px; right: 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; min-width: 180px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 300; }
  #dataMenu button, #dataMenu label { display: block; width: 100%; padding: 10px 16px; background: none; border: none; color: var(--text); font-size: 13px; text-align: left; cursor: pointer; font-family: var(--font); }
  #dataMenu button:hover, #dataMenu label:hover { background: var(--bg4); }
  #dataMenuBack { position: fixed; inset: 0; z-index: 299; display: none; }

  /* MOBILE NAV */
  .mobile-nav { display: none; }

  @media (max-width: 700px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 56px 1fr; }
    .topbar { padding-top: calc(var(--safe-top) + 4px); }
    .logo { display: none; }
    .search-wrap { max-width: none; }
    .sidebar { display: none; }
    .main { padding: 14px 14px calc(72px + var(--safe-bottom)); }
    .cards-grid { grid-template-columns: 1fr; gap: 10px; }
    .form-grid { grid-template-columns: 1fr; }
    .count-badge { display: none; }
    .modal { border-radius: 16px 16px 0 0; max-height: 95vh; }
    #dataMenu { right: 8px; }

    .mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg2); border-top: 1px solid var(--border); z-index: 50; padding-bottom: var(--safe-bottom); }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px; border: none; background: transparent; color: var(--text3); font-size: 10px; font-family: var(--font); cursor: pointer; touch-action: manipulation; transition: color 0.15s; }
    .nav-btn.active { color: var(--text); }
    .nav-icon { font-size: 18px; line-height: 1; }
    .nav-add-icon { font-size: 24px; line-height: 1; }

    /* Filter drawer */
    .filter-drawer { position: fixed; inset: 0; z-index: 90; display: none; }
    .filter-drawer.open { display: block; }
    .filter-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.65); }
    .filter-panel { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg2); border-radius: 16px 16px 0 0; padding: 0 0 calc(16px + var(--safe-bottom)); max-height: 80vh; overflow-y: auto; animation: slideUp 0.22s ease; }
    .filter-panel-drag { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 8px; }
    .fp-label { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); padding: 8px 16px 4px; }
    .filter-panel .filter-btn { padding: 10px 16px; font-size: 14px; border-radius: 0; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="logo">Ferenc Bodor <span>/ Contacts</span></div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Search…" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="openModal()" style="white-space:nowrap">+ Add</button>
      <button class="btn btn-ghost btn-sm" onclick="showDataMenu()">⋯</button>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Views</div>
      <button class="filter-btn active" onclick="setFilter('all',this)">All Contacts <span class="filter-count" id="count-all">0</span></button>
      <button class="filter-btn" onclick="setFilter('multiplicator',this)">⭐ Multiplicators <span class="filter-count" id="count-multi">0</span></button>
      <button class="filter-btn" onclick="setFilter('followup',this)">🔔 Follow-up Due <span class="filter-count" id="count-followup">0</span></button>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-label">Status</div>
      <button class="filter-btn" onclick="setFilter('status:to-contact',this)"><span class="filter-dot" style="background:#555"></span>To Contact <span class="filter-count" id="count-to-contact">0</span></button>
      <button class="filter-btn" onclick="setFilter('status:contacted',this)"><span class="filter-dot" style="background:var(--blue)"></span>Contacted <span class="filter-count" id="count-contacted">0</span></button>
      <button class="filter-btn" onclick="setFilter('status:in-talk',this)"><span class="filter-dot" style="background:var(--yellow)"></span>In Talk <span class="filter-count" id="count-in-talk">0</span></button>
      <button class="filter-btn" onclick="setFilter('status:booked',this)"><span class="filter-dot" style="background:var(--green)"></span>Booked <span class="filter-count" id="count-booked">0</span></button>
      <button class="filter-btn" onclick="setFilter('status:cold',this)"><span class="filter-dot" style="background:var(--border)"></span>Cold <span class="filter-count" id="count-cold">0</span></button>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-label">City</div>
      <div id="cityFilters"></div>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-label">Role</div>
      <div id="roleFilters"></div>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section" style="display:flex;flex-direction:column;gap:6px">
      <button class="btn btn-ghost btn-sm" onclick="exportCSV()" style="width:100%">Export CSV</button>
      <button class="btn btn-ghost btn-sm" onclick="exportJSON()" style="width:100%">Backup JSON</button>
      <label class="btn btn-ghost btn-sm" style="width:100%;cursor:pointer;text-align:center">Restore JSON<input type="file" accept=".json" onchange="importJSON(event)" style="display:none"></label>
    </div>
  </div>

  <div class="main">
    <div id="followupAlert" class="followup-alert">
      <h4>🔔 Follow-up Due</h4>
      <div class="followup-names" id="followupNames"></div>
    </div>
    <div class="section-header">
      <span class="section-title" id="sectionTitle">All Contacts</span>
      <span class="count-badge" id="visibleCount">0</span>
      <div style="margin-left:auto;display:flex;gap:6px">
        <div class="view-toggle">
          <button class="view-btn active" onclick="setView('cards',this)">⊞</button>
          <button class="view-btn" onclick="setView('table',this)">☰</button>
        </div>
      </div>
    </div>
    <div id="cardsView" class="cards-grid"></div>
    <table id="tableView" class="contacts-table" style="display:none">
      <thead><tr><th>Name</th><th>Role</th><th>Company</th><th>City</th><th>Status</th><th>Follow-up</th><th>⭐</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty" style="display:none">
      <h3>No contacts found</h3>
      <p>Try a different filter, or add a new contact.</p>
    </div>
  </div>
</div>

<!-- MOBILE BOTTOM NAV -->
<div class="mobile-nav">
  <button class="nav-btn active" id="nav-all" onclick="mobileNav('all',this)">
    <span class="nav-icon">👤</span><span>All</span>
  </button>
  <button class="nav-btn" id="nav-followup" onclick="mobileNav('followup',this)">
    <span class="nav-icon">🔔</span><span id="nav-fu-label">Follow-up</span>
  </button>
  <button class="nav-btn" onclick="openModal()">
    <span class="nav-add-icon">＋</span><span>Add</span>
  </button>
  <button class="nav-btn" id="nav-multi" onclick="mobileNav('multiplicator',this)">
    <span class="nav-icon">⭐</span><span>Stars</span>
  </button>
  <button class="nav-btn" onclick="openFilterDrawer()">
    <span class="nav-icon">⚙</span><span>Filter</span>
  </button>
</div>

<!-- MOBILE FILTER DRAWER -->
<div class="filter-drawer" id="filterDrawer">
  <div class="filter-backdrop" onclick="closeFilterDrawer()"></div>
  <div class="filter-panel">
    <div class="filter-panel-drag"></div>
    <div class="fp-label">Status</div>
    <button class="filter-btn" onclick="mobileFilter('all')">All Contacts <span class="filter-count" id="m-count-all">0</span></button>
    <button class="filter-btn" onclick="mobileFilter('status:to-contact')"><span class="filter-dot" style="background:#555"></span>To Contact <span class="filter-count" id="m-count-to-contact">0</span></button>
    <button class="filter-btn" onclick="mobileFilter('status:contacted')"><span class="filter-dot" style="background:var(--blue)"></span>Contacted <span class="filter-count" id="m-count-contacted">0</span></button>
    <button class="filter-btn" onclick="mobileFilter('status:in-talk')"><span class="filter-dot" style="background:var(--yellow)"></span>In Talk <span class="filter-count" id="m-count-in-talk">0</span></button>
    <button class="filter-btn" onclick="mobileFilter('status:booked')"><span class="filter-dot" style="background:var(--green)"></span>Booked <span class="filter-count" id="m-count-booked">0</span></button>
    <button class="filter-btn" onclick="mobileFilter('status:cold')"><span class="filter-dot" style="background:var(--border)"></span>Cold <span class="filter-count" id="m-count-cold">0</span></button>
    <div class="sidebar-divider"></div>
    <div class="fp-label">City</div>
    <div id="mCityFilters"></div>
    <div class="sidebar-divider"></div>
    <div class="fp-label">Data</div>
    <button class="filter-btn" onclick="exportJSON();closeFilterDrawer()">📦 Backup JSON</button>
    <label class="filter-btn" style="cursor:pointer">📂 Restore JSON<input type="file" accept=".json" onchange="importJSON(event);closeFilterDrawer()" style="display:none"></label>
    <button class="filter-btn" onclick="exportCSV();closeFilterDrawer()">📄 Export CSV</button>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-drag"></div>
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">New Contact</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">

      <div class="same-company-warning" id="sameCompanyWarning">
        <span>⚠</span><span id="sameCompanyText"></span>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" id="f-firstname" placeholder="Jane" autocomplete="given-name">
        </div>
        <div class="form-group">
          <label>Last Name *</label>
          <input type="text" id="f-lastname" placeholder="Smith" autocomplete="family-name">
        </div>
        <div class="form-group">
          <label>Role</label>
          <input type="text" id="f-role" placeholder="Head of Production" list="roleList">
          <datalist id="roleList"></datalist>
        </div>
        <div class="form-group">
          <label>Company</label>
          <input type="text" id="f-company" placeholder="Agency or production co." list="companyList" oninput="checkSameCompany()">
          <datalist id="companyList"></datalist>
        </div>
        <div class="form-group">
          <label>City</label>
          <input type="text" id="f-city" placeholder="Berlin" list="cityList">
          <datalist id="cityList">
            <option value="Berlin"><option value="Hamburg"><option value="Munich">
            <option value="Cologne"><option value="Frankfurt"><option value="Vienna"><option value="Zurich">
          </datalist>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="f-status">
            <option value="to-contact">To Contact</option>
            <option value="contacted">Contacted</option>
            <option value="in-talk">In Talk</option>
            <option value="booked">Booked</option>
            <option value="cold">Cold</option>
          </select>
        </div>
        <div class="form-group">
          <label>Email</label>
          <div class="email-link-wrap">
            <input type="email" id="f-email" placeholder="jane@company.com" autocomplete="email">
            <button class="email-mailto" id="emailMailtoBtn" onclick="openMailto()" title="Open in Mail" style="display:none">✉</button>
          </div>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="f-phone" placeholder="+49 000 000 0000" autocomplete="tel">
        </div>
        <div class="form-group">
          <label>Instagram</label>
          <input type="text" id="f-instagram" placeholder="@username" autocomplete="off">
        </div>
        <div class="form-group">
          <label>LinkedIn</label>
          <input type="text" id="f-linkedin" placeholder="linkedin.com/in/…" autocomplete="off">
        </div>
        <div class="form-group">
          <label>Last Contacted</label>
          <input type="date" id="f-lastcontact">
        </div>
        <div class="form-group">
          <label>Follow-up Date</label>
          <input type="date" id="f-followup">
        </div>
        <div class="form-group full">
          <label>Notes</label>
          <textarea id="f-notes" placeholder="How you met, shared projects, personal details…"></textarea>
        </div>
        <div class="form-group full">
          <div class="checkbox-group">
            <input type="checkbox" id="f-multi">
            <label for="f-multi">⭐ Multiplicator — connects many people</label>
          </div>
        </div>
      </div>

      <div class="outreach-section" id="outreachSection" style="display:none">
        <div class="outreach-title">Outreach Log</div>
        <div id="logEntries"></div>
        <div class="followup-suggest" id="followupSuggest">
          <span>Set follow-up in 14 days?</span>
          <button class="fs-set" onclick="setFollowupIn14()">Set it</button>
          <button class="fs-dismiss" onclick="dismissFollowupSuggest()">Dismiss</button>
        </div>
        <div class="log-add">
          <input type="text" id="logInput" placeholder="Log a note, call, or email…" onkeydown="if(event.key==='Enter')addLog()">
          <button class="btn btn-ghost btn-sm" onclick="addLog()">Log</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="deleteBtn" onclick="deleteContact()" style="display:none">Delete</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveContact()">Save</button>
    </div>
  </div>
</div>

<!-- DATA MENU -->
<div id="dataMenuBack" onclick="hideDataMenu()"></div>
<div id="dataMenu" style="display:none;position:fixed">
  <button onclick="exportJSON();hideDataMenu()">📦 Backup JSON</button>
  <label style="cursor:pointer">📂 Restore JSON<input type="file" accept=".json" onchange="importJSON(event);hideDataMenu()" style="display:none"></label>
  <button onclick="exportCSV();hideDataMenu()">📄 Export CSV</button>
</div>

<div class="toast" id="toast"></div>

<script>
let contacts = JSON.parse(localStorage.getItem('fb_contacts') || '[]');
let currentFilter = 'all';
let currentView = 'cards';
let editingId = null;
let currentSearch = '';

function save() { localStorage.setItem('fb_contacts', JSON.stringify(contacts)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function today() { return new Date().toISOString().split('T')[0]; }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400);
}

function getStatusClass(s) {
  return {'to-contact':'status-to-contact','contacted':'status-contacted','in-talk':'status-in-talk','booked':'status-booked','cold':'status-cold'}[s] || 'status-to-contact';
}
function getStatusLabel(s) {
  return {'to-contact':'To Contact','contacted':'Contacted','in-talk':'In Talk','booked':'Booked','cold':'Cold'}[s] || s;
}
function isOverdue(d) { return d ? new Date(d) < new Date() : false; }
function formatDate(d) {
  if (!d) return '';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
}
function initials(c) { return ((c.firstname||'')[0]||'') + ((c.lastname||'')[0]||''); }

function filterContacts() {
  let list = [...contacts];
  const q = currentSearch.toLowerCase();
  if (q) list = list.filter(c => [c.firstname,c.lastname,c.company,c.role,c.city,c.notes].join(' ').toLowerCase().includes(q));
  if (currentFilter === 'multiplicator') list = list.filter(c => c.multiplicator);
  else if (currentFilter === 'followup') list = list.filter(c => c.followup && isOverdue(c.followup));
  else if (currentFilter.startsWith('status:')) list = list.filter(c => c.status === currentFilter.split(':')[1]);
  else if (currentFilter.startsWith('city:')) list = list.filter(c => (c.city||'').toLowerCase() === currentFilter.split(':')[1]);
  else if (currentFilter.startsWith('role:')) list = list.filter(c => (c.role||'').toLowerCase() === currentFilter.split(':')[1]);
  return list;
}

function render() {
  const list = filterContacts();
  updateCounts(); updateSidebarDynamic(); renderFollowupAlert();
  document.getElementById('visibleCount').textContent = list.length + (list.length !== 1 ? ' contacts' : ' contact');
  if (currentView === 'cards') renderCards(list); else renderTable(list);
  document.getElementById('emptyState').style.display = list.length === 0 ? 'block' : 'none';
}

function renderCards(list) {
  const el = document.getElementById('cardsView');
  el.style.display = 'grid';
  el.innerHTML = list.map(c => `
    <div class="contact-card" onclick="openModal('${c.id}')">
      ${c.multiplicator ? '<div class="multi-star">⭐</div>' : ''}
      <div class="card-top">
        <div>
          <div class="card-name">${c.firstname} ${c.lastname}</div>
          <div class="card-role">${c.role || '<span style="color:var(--text3)">No role</span>'}</div>
          <div class="card-company">${c.company || ''}</div>
        </div>
        <div class="card-avatar">${initials(c).toUpperCase()}</div>
      </div>
      <div class="card-tags">
        ${c.status ? `<span class="tag tag-status ${getStatusClass(c.status)}">${getStatusLabel(c.status)}</span>` : ''}
        ${c.city ? `<span class="tag tag-city">${c.city}</span>` : ''}
      </div>
      ${c.followup ? `<div class="card-followup ${isOverdue(c.followup) ? 'overdue' : ''}">
        ${isOverdue(c.followup) ? '⚠ Follow-up overdue' : '🔔 ' + formatDate(c.followup)}
      </div>` : ''}
    </div>`).join('');
}

function renderTable(list) {
  document.getElementById('tableBody').innerHTML = list.map(c => `
    <tr onclick="openModal('${c.id}')">
      <td><strong>${c.firstname} ${c.lastname}</strong></td>
      <td>${c.role||'—'}</td><td>${c.company||'—'}</td><td>${c.city||'—'}</td>
      <td><span class="tag tag-status ${getStatusClass(c.status)}">${getStatusLabel(c.status)}</span></td>
      <td style="color:${c.followup&&isOverdue(c.followup)?'var(--red)':'var(--text2)'}">${formatDate(c.followup)||'—'}</td>
      <td>${c.multiplicator?'⭐':''}</td>
    </tr>`).join('');
}

function updateCounts() {
  document.getElementById('count-all').textContent = contacts.length;
  document.getElementById('count-multi').textContent = contacts.filter(c => c.multiplicator).length;
  const od = contacts.filter(c => c.followup && isOverdue(c.followup)).length;
  document.getElementById('count-followup').textContent = od;
  const navFu = document.getElementById('nav-fu-label');
  if (navFu) navFu.textContent = od > 0 ? `Follow-up (${od})` : 'Follow-up';
  ['to-contact','contacted','in-talk','booked','cold'].forEach(s => {
    const n = contacts.filter(c => c.status === s).length;
    const a = document.getElementById('count-'+s); if(a) a.textContent = n;
    const b = document.getElementById('m-count-'+s); if(b) b.textContent = n;
  });
  const ma = document.getElementById('m-count-all'); if(ma) ma.textContent = contacts.length;
}

function updateSidebarDynamic() {
  const cities = [...new Set(contacts.map(c => c.city).filter(Boolean))].sort();
  document.getElementById('cityFilters').innerHTML = cities.map(city => `
    <button class="filter-btn ${currentFilter==='city:'+city.toLowerCase()?'active':''}" onclick="setFilter('city:${city.toLowerCase()}',this)">
      ${city} <span class="filter-count">${contacts.filter(c=>(c.city||'').toLowerCase()===city.toLowerCase()).length}</span>
    </button>`).join('');
  document.getElementById('mCityFilters').innerHTML = cities.map(city =>
    `<button class="filter-btn" onclick="mobileFilter('city:${city.toLowerCase()}')">${city} <span class="filter-count">${contacts.filter(c=>(c.city||'').toLowerCase()===city.toLowerCase()).length}</span></button>`
  ).join('');
  const roles = [...new Set(contacts.map(c => c.role).filter(Boolean))].sort();
  document.getElementById('roleFilters').innerHTML = roles.map(role => `
    <button class="filter-btn ${currentFilter==='role:'+role.toLowerCase()?'active':''}" onclick="setFilter('role:${role.toLowerCase()}',this)">
      ${role} <span class="filter-count">${contacts.filter(c=>(c.role||'').toLowerCase()===role.toLowerCase()).length}</span>
    </button>`).join('');
  document.getElementById('roleList').innerHTML = roles.map(r => `<option value="${r}">`).join('');
  const companies = [...new Set(contacts.map(c => c.company).filter(Boolean))].sort();
  document.getElementById('companyList').innerHTML = companies.map(co => `<option value="${co}">`).join('');
}

function renderFollowupAlert() {
  const overdue = contacts.filter(c => c.followup && isOverdue(c.followup));
  const el = document.getElementById('followupAlert');
  if (overdue.length > 0) {
    el.classList.add('visible');
    document.getElementById('followupNames').innerHTML = overdue.map(c =>
      `<span class="followup-chip" onclick="openModal('${c.id}')">${c.firstname} ${c.lastname}</span>`).join('');
  } else { el.classList.remove('visible'); }
}

function checkSameCompany() {
  const company = document.getElementById('f-company').value.trim().toLowerCase();
  const w = document.getElementById('sameCompanyWarning');
  if (!company) { w.classList.remove('visible'); return; }
  const active = ['to-contact','contacted','in-talk'];
  const existing = contacts.filter(c => (c.company||'').toLowerCase()===company && active.includes(c.status) && c.id!==editingId);
  if (existing.length > 0) {
    document.getElementById('sameCompanyText').innerHTML =
      `Active outreach here: ${existing.map(c=>`<strong>${c.firstname} ${c.lastname}</strong> (${getStatusLabel(c.status)})`).join(', ')}`;
    w.classList.add('visible');
  } else { w.classList.remove('visible'); }
}

document.getElementById('f-email').addEventListener('input', function() {
  document.getElementById('emailMailtoBtn').style.display = this.value.trim() ? 'block' : 'none';
});
function openMailto() {
  const e = document.getElementById('f-email').value.trim();
  if (e) window.location.href = 'mailto:' + e;
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const t = {'all':'All Contacts','multiplicator':'Multiplicators','followup':'Follow-up Due','status:to-contact':'To Contact','status:contacted':'Contacted','status:in-talk':'In Talk','status:booked':'Booked','status:cold':'Cold'};
  document.getElementById('sectionTitle').textContent = t[filter] || filter.split(':')[1];
  render();
}
function setView(view, btn) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('cardsView').style.display = view==='cards' ? 'grid' : 'none';
  document.getElementById('tableView').style.display = view==='table' ? 'table' : 'none';
  render();
}

function mobileNav(filter, btn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = filter;
  const t = {'all':'All Contacts','multiplicator':'Multiplicators','followup':'Follow-up Due'};
  document.getElementById('sectionTitle').textContent = t[filter] || filter;
  render();
}
function openFilterDrawer() { document.getElementById('filterDrawer').classList.add('open'); }
function closeFilterDrawer() { document.getElementById('filterDrawer').classList.remove('open'); }
function mobileFilter(filter) {
  currentFilter = filter;
  const t = {'all':'All Contacts','multiplicator':'Multiplicators','followup':'Follow-up Due','status:to-contact':'To Contact','status:contacted':'Contacted','status:in-talk':'In Talk','status:booked':'Booked','status:cold':'Cold'};
  document.getElementById('sectionTitle').textContent = t[filter] || filter.split(':')[1];
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  closeFilterDrawer(); render();
}

function showDataMenu() {
  const m = document.getElementById('dataMenu');
  const b = document.getElementById('dataMenuBack');
  m.style.display = 'block'; b.style.display = 'block';
  const btn = event.currentTarget.getBoundingClientRect();
  m.style.top = (btn.bottom + 4) + 'px';
  m.style.right = (window.innerWidth - btn.right) + 'px';
}
function hideDataMenu() {
  document.getElementById('dataMenu').style.display = 'none';
  document.getElementById('dataMenuBack').style.display = 'none';
}

function openModal(id) {
  editingId = id || null;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sameCompanyWarning').classList.remove('visible');
  document.getElementById('followupSuggest').classList.remove('visible');
  if (id) {
    const c = contacts.find(x => x.id === id);
    if (!c) return;
    document.getElementById('modalTitle').textContent = c.firstname + ' ' + c.lastname;
    document.getElementById('deleteBtn').style.display = 'block';
    document.getElementById('outreachSection').style.display = 'block';
    ['firstname','lastname','role','company','city','email','phone','instagram','linkedin','notes'].forEach(f =>
      document.getElementById('f-'+f).value = c[f] || '');
    document.getElementById('f-status').value = c.status || 'to-contact';
    document.getElementById('f-lastcontact').value = c.lastcontact || '';
    document.getElementById('f-followup').value = c.followup || '';
    document.getElementById('f-multi').checked = c.multiplicator || false;
    document.getElementById('emailMailtoBtn').style.display = c.email ? 'block' : 'none';
    renderLog(c.log || []);
  } else {
    document.getElementById('modalTitle').textContent = 'New Contact';
    document.getElementById('deleteBtn').style.display = 'none';
    document.getElementById('outreachSection').style.display = 'none';
    ['firstname','lastname','role','company','city','email','phone','instagram','linkedin','notes'].forEach(f =>
      document.getElementById('f-'+f).value = '');
    document.getElementById('f-status').value = 'to-contact';
    document.getElementById('f-lastcontact').value = '';
    document.getElementById('f-followup').value = '';
    document.getElementById('f-multi').checked = false;
    document.getElementById('emailMailtoBtn').style.display = 'none';
    document.getElementById('logEntries').innerHTML = '';
  }
  setTimeout(() => document.getElementById('f-firstname').focus(), 150);
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); editingId = null; }
function handleOverlayClick(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

function saveContact() {
  const firstname = document.getElementById('f-firstname').value.trim();
  const lastname = document.getElementById('f-lastname').value.trim();
  if (!firstname && !lastname) { alert('Please enter at least a name.'); return; }
  const data = {
    firstname, lastname,
    role: document.getElementById('f-role').value.trim(),
    company: document.getElementById('f-company').value.trim(),
    city: document.getElementById('f-city').value.trim(),
    status: document.getElementById('f-status').value,
    email: document.getElementById('f-email').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    instagram: document.getElementById('f-instagram').value.trim(),
    linkedin: document.getElementById('f-linkedin').value.trim(),
    lastcontact: document.getElementById('f-lastcontact').value,
    followup: document.getElementById('f-followup').value,
    notes: document.getElementById('f-notes').value.trim(),
    multiplicator: document.getElementById('f-multi').checked,
  };
  if (editingId) {
    const i = contacts.findIndex(c => c.id === editingId);
    if (i > -1) contacts[i] = { ...contacts[i], ...data };
  } else {
    contacts.push({ id: uid(), ...data, log: [] });
  }
  save(); closeModal(); render(); showToast('Contact saved ✓');
}

function deleteContact() {
  if (!editingId || !confirm('Delete this contact?')) return;
  contacts = contacts.filter(c => c.id !== editingId);
  save(); closeModal(); render(); showToast('Contact deleted');
}

function renderLog(log) {
  document.getElementById('logEntries').innerHTML = (log||[]).slice().reverse().map(e =>
    `<div class="log-entry"><div class="log-date">${formatDate(e.date)}</div><div class="log-text">${e.text}</div></div>`
  ).join('') || '<div style="color:var(--text3);font-size:12px;margin-bottom:6px">No outreach logged yet.</div>';
}

function addLog() {
  if (!editingId) return;
  const input = document.getElementById('logInput');
  const text = input.value.trim(); if (!text) return;
  const i = contacts.findIndex(c => c.id === editingId); if (i === -1) return;
  if (!contacts[i].log) contacts[i].log = [];
  contacts[i].log.push({ date: today(), text });
  contacts[i].lastcontact = today();
  document.getElementById('f-lastcontact').value = today();
  save(); renderLog(contacts[i].log); input.value = '';
  if (!contacts[i].followup) document.getElementById('followupSuggest').classList.add('visible');
}

function setFollowupIn14() {
  const d = new Date(); d.setDate(d.getDate() + 14);
  const val = d.toISOString().split('T')[0];
  document.getElementById('f-followup').value = val;
  document.getElementById('followupSuggest').classList.remove('visible');
  showToast('Follow-up set for ' + formatDate(val));
}
function dismissFollowupSuggest() { document.getElementById('followupSuggest').classList.remove('visible'); }

function exportCSV() {
  const fields = ['firstname','lastname','role','company','city','status','email','phone','instagram','linkedin','lastcontact','followup','multiplicator','notes'];
  const csv = [fields.join(','), ...contacts.map(c => fields.map(f => '"'+String(c[f]||'').replace(/"/g,'""')+'"').join(','))].join('\n');
  dl('contacts_'+today()+'.csv', 'text/csv;charset=utf-8,', csv);
  showToast('CSV exported');
}
function exportJSON() {
  dl('fb_contacts_backup_'+today()+'.json', 'application/json,', JSON.stringify({version:1,exported:new Date().toISOString(),contacts},null,2));
  showToast('Backup saved ✓');
}
function importJSON(event) {
  const file = event.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const imp = data.contacts || data;
      if (!Array.isArray(imp)) throw new Error();
      if (!confirm(`Import ${imp.length} contacts? This replaces all current data.`)) return;
      contacts = imp; save(); render(); showToast(`Imported ${imp.length} contacts ✓`);
    } catch { alert('Invalid backup file.'); }
  };
  r.readAsText(file); event.target.value = '';
}
function dl(name, mime, content) {
  const a = document.createElement('a');
  a.href = 'data:'+mime+encodeURIComponent(content); a.download = name; a.click();
}

document.getElementById('searchInput').addEventListener('input', e => { currentSearch = e.target.value; render(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.metaKey||e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('searchInput').focus(); }
});

render();
</script>
</body>
</html>
